<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Ejercicio 6 CSS</title>

<style type="text/css">
body {
    font-family: Arial, Helvetica, sans-serif;
}

#contenedor {
    width: 700px;
    margin: auto;
    border: 1px solid #999999;
    padding: 20px;
}

#anterior {
    float: left;
    background-color: #CCCCCC;
    padding: 10px;
}

#siguiente {
    float: right;
    background-color: #CCCCCC;
    padding: 10px;
}

.clear {
    clear: both;
}
</style>
</head>

<body>

<div id="contenedor">

    <h1>Navegación</h1>

    <div id="anterior">
        &laquo; Anterior
    </div>

    <div id="siguiente">
        Siguiente &raquo;
    </div>

    <div class="clear"></div>

</div>

</body>
</html>
